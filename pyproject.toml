[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconx"
version = "1.0.0"
description = "ReconX - Enterprise Distributed Data Reconciliation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ReconX Platform Team" }]
keywords = ["reconciliation", "spark", "data-quality", "enterprise", "streamlit"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Developers",
  "Topic :: Database",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymongo>=4.7",
  "sqlalchemy>=2.0",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "croniter>=2.0",
  "cryptography>=42.0",
  "tenacity>=8.2",
  "jinja2>=3.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
]
ui = ["streamlit>=1.36", "plotly>=5.22", "pandas>=2.2", "httpx>=0.27"]
spark = ["pyspark>=3.5,<4.0", "pandas>=2.2", "pyarrow>=15.0"]
connectors = [
  "boto3>=1.34",
  "paramiko>=3.4",
  "openpyxl>=3.1",
  "confluent-kafka>=2.4",
  "psycopg[binary]>=3.1",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "mongomock>=4.1",
  "aiosmtpd>=1.4",
  "types-PyYAML",
  "pre-commit>=3.7",
]
all = ["reconx[api,ui,spark,connectors]"]

[project.scripts]
reconx-api = "reconx.api.main:run"
reconx-scheduler = "reconx.scheduler.service:run"
reconx-job = "reconx.spark.job:main"
reconx-admin = "reconx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reconx = ["metrics/migrations/*.sql", "notifications/templates/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: fast tests with no external dependencies",
  "spark: tests that start a local SparkSession",
  "integration: tests that require docker-backed services",
  "e2e: full end-to-end pipeline tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  "E501",     # line length is handled by the formatter
  "B008",     # FastAPI's Depends()/Query() defaults are the documented idiom
  "S101",     # asserts are how tests assert
  "RUF012",   # ClassVar annotations add noise to pydantic models
  "N818",     # our exception names are domain terms, not *Error suffixes
  "SIM108",   # ternaries are not always clearer than if/else
  "S608",     # SQL is built from validated identifiers, guarded by sql_guard
  "N812",     # `from pyspark.sql import functions as F` is the universal Spark idiom
  "RUF001",   # typographic dashes/quotes in prose docstrings are deliberate
  "UP042",    # our StrEnum predates 3.11's and carries extra behaviour
  "C408",     # dict(...) reads better than {...} for plotly/spark option bags
  "BLE001",   # broad excepts at service boundaries are deliberate and logged
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N806"]
"src/reconx/ui/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = "(tests|deployment)"
