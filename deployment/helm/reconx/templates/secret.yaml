{{- if not .Values.security.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconx.fullname" . }}-secrets
  labels: {{- include "reconx.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* A generated JWT secret keeps a first install working; set it explicitly
         (or use security.existingSecret) so tokens survive a helm upgrade. */}}
  RECONX_SECURITY_JWT_SECRET: {{ .Values.security.jwtSecret | default (randAlphaNum 48) | quote }}
  RECONX_SECURITY_ENCRYPTION_KEY: {{ required "security.encryptionKey is required: connection secrets cannot be encrypted without it (generate with `reconx-admin gen-key`)" .Values.security.encryptionKey | quote }}
  RESULT_JDBC_PASSWORD: {{ .Values.security.resultDatabasePassword | quote }}
  {{- if .Values.smtp.enabled }}
  SMTP_PASSWORD: {{ .Values.security.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.kafka.saslMechanism }}
  KAFKA_SASL_PASSWORD: {{ .Values.security.kafkaSaslPassword | quote }}
  {{- end }}
  {{- range $key, $value := .Values.security.connectionSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
