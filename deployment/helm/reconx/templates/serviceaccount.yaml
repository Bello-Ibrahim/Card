{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reconx.serviceAccountName" . }}
  labels: {{- include "reconx.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.spark.serviceAccount }}
  labels: {{- include "reconx.labels" . | nindent 4 }}
{{- end }}
