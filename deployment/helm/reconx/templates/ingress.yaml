{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "reconx.fullname" . }}
  labels: {{- include "reconx.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "reconx.fullname" . }}-api
                port: {number: {{ .Values.api.service.port }}}
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "reconx.fullname" . }}-api
                port: {number: {{ .Values.api.service.port }}}
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "reconx.fullname" . }}-api
                port: {number: {{ .Values.api.service.port }}}
          {{- if .Values.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "reconx.fullname" . }}-ui
                port: {number: {{ .Values.ui.service.port }}}
          {{- end }}
{{- end }}
