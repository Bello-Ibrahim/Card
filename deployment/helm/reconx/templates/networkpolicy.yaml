{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reconx.fullname" . }}-default-deny
  labels: {{- include "reconx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "reconx.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reconx.fullname" . }}-allow-ingress
  labels: {{- include "reconx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: ["api", "ui"]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}}
        - podSelector:
            matchLabels: {{- include "reconx.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8501}
{{- end }}
