{{- if .Values.rbac.create }}
{{- /* Spark drivers create their own executor pods; the scheduler submits them. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "reconx.fullname" . }}-spark
  labels: {{- include "reconx.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "reconx.fullname" . }}-spark
  labels: {{- include "reconx.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.spark.serviceAccount }}
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: {{ include "reconx.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "reconx.fullname" . }}-spark
  apiGroup: rbac.authorization.k8s.io
{{- end }}
