{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reconx.fullname" . }}-ui
  labels:
    {{- include "reconx.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "reconx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        {{- include "reconx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "reconx.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: {{ include "reconx.image" (list . "ui") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8501}
          envFrom: {{- include "reconx.envFrom" . | nindent 12 }}
          env:
            - {name: RECONX_SERVICE, value: reconx-ui}
            - name: RECONX_API_URL
              value: {{ printf "http://%s-api:%v" (include "reconx.fullname" .) .Values.api.service.port | quote }}
            {{- with .Values.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 25
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "reconx.fullname" . }}-ui
  labels:
    {{- include "reconx.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "reconx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - {name: http, port: {{ .Values.ui.service.port }}, targetPort: http}
{{- if .Values.ui.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "reconx.fullname" . }}-ui
  labels: {{- include "reconx.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.ui.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "reconx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
{{- end }}
{{- end }}
