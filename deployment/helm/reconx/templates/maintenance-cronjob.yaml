{{- if .Values.maintenance.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "reconx.fullname" . }}-maintenance
  labels:
    {{- include "reconx.labels" . | nindent 4 }}
    app.kubernetes.io/component: maintenance
spec:
  schedule: {{ .Values.maintenance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "reconx.serviceAccountName" . }}
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: maintenance
              image: {{ include "reconx.image" (list . "api") }}
              command: ["python", "-m", "reconx.cli", "maintenance", "--purge", "--replay-events"]
              envFrom: {{- include "reconx.envFrom" . | nindent 16 }}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              securityContext: {{- toYaml .Values.containerSecurityContext | nindent 16 }}
{{- end }}
