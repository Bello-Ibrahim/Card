apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconx-ui
  namespace: reconx
  labels: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
    spec:
      serviceAccountName: reconx
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: reconx/ui:1.0.0
          ports:
            - {name: http, containerPort: 8501}
          envFrom:
            - configMapRef: {name: reconx-config}
          env:
            - name: RECONX_SERVICE
              value: reconx-ui
            - name: RECONX_API_URL
              value: http://reconx-api:8000
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 25
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: reconx-ui
  namespace: reconx
  labels: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
  ports:
    - {name: http, port: 8501, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reconx-ui
  namespace: reconx
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: reconx, app.kubernetes.io/component: ui}
