# TEMPLATE ONLY - do not commit real values.
#
# In production create this from a secret manager (External Secrets Operator,
# Sealed Secrets, Vault Agent Injector). The connection-level secrets that
# reconciliations reference as `k8s:<key>` are read from the projected volume
# at RECONX_SECURITY_SECRETS_FILE_DIR.
apiVersion: v1
kind: Secret
metadata:
  name: reconx-secrets
  namespace: reconx
  labels: {app.kubernetes.io/name: reconx}
type: Opaque
stringData:
  # Platform secrets (consumed as environment variables)
  RECONX_SECURITY_JWT_SECRET: "REPLACE-with-a-32-byte-random-value"
  RECONX_SECURITY_ENCRYPTION_KEY: "REPLACE-with-output-of: reconx-admin gen-key"
  RESULT_JDBC_PASSWORD: "REPLACE"
  SMTP_PASSWORD: "REPLACE"
  KAFKA_SASL_PASSWORD: ""

  # Connection secrets referenced from a reconciliation as k8s:<key>
  s3_access_key: "REPLACE"
  s3_secret_key: "REPLACE"
  sftp_private_key: "REPLACE"
  ledger_db_password: "REPLACE"
