# Default-deny ingress with explicit allowances. Adjust to your cluster's CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconx-default-deny
  namespace: reconx
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconx-allow-ingress-controller
  namespace: reconx
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: ["api", "ui"]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 8501}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reconx-allow-internal
  namespace: reconx
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: reconx}
